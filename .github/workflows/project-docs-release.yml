name: Release Project Docs CLI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Commit or branch containing the version to release'
        required: true
        default: main
        type: string

run-name: 'Release Project Docs CLI from ${{ inputs.target_ref }}'

permissions:
  contents: write

concurrency:
  group: project-docs-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and tag Project Docs CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out release target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve and validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json has an invalid version: $version" >&2
            exit 1
          fi

          tag="project-docs-v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run CLI tests
        run: node --test tests/project-docs.test.js

      - name: Check package contents
        run: npm pack --dry-run

      - name: Smoke-test the remote commit
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          trap 'rm -rf "$target"' EXIT

          npm_config_cache="${RUNNER_TEMP}/project-docs-npm-cache" \
            npx --yes --package="github:${RELEASE_REPOSITORY}#${RELEASE_SHA}" -- \
            project-docs init ios-uikit \
            --target "$target" \
            --include gitflow \
            --include rxswift \
            --apply

          test -f "$target/AGENTS.md"
          test -f "$target/docs/Root.md"
          test -f "$target/docs/architecture/architecture.md"
          test -f "$target/docs/architecture/rxswift.md"
          test -f "$target/docs/architecture/rxswift-binding-policy.md"
          test -f "$target/docs/architecture/rxswift-input-output.md"
          test -f "$target/docs/development/testing.md"
          test -f "$target/docs/development/gitflow.md"
          test ! -e "$target/package.json"
          test ! -e "$target/package-lock.json"
          test ! -e "$target/node_modules"

      - name: Publish release tag
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Project Docs ${RELEASE_VERSION}"
          git push origin "refs/tags/${RELEASE_TAG}"
